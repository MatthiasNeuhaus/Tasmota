[env:tasmota32solo1-DE]
extends                 = env:tasmota32_base
board                   = esp32_solo1
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_TASMOTA32
                          -DMY_LANGUAGE=de_DE
                          -DCODE_IMAGE_STR='"solo1"'
                          -DOTA_URL='""'

[env:tasmota32solo1-DE-BLE]
extends                 = env:tasmota32_base
board                   = esp32_solo1
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_TASMOTA32
                          -DMY_LANGUAGE=de_DE
                          -DCODE_IMAGE_STR='"solo1"'
                          -DOTA_URL='""'
                          -DFIRMWARE_BLUETOOTH
lib_extra_dirs          = lib/libesp32, lib/libesp32_div, lib/lib_basic, lib/lib_i2c, lib/lib_ssl, lib/lib_rf, lib/lib_div


; platformio_tasmota_cenv.ini - ESP32 16MB mit SML + Berry
;
; Kompilieren:
;   1. platformio run -e tasmota32-safeboot
;   2. platformio run -e tasmota32_16mb_sml
;

[env:tasmota32_16mb_sml]
extends                 = env:tasmota32_base
board                   = esp32
board_build.f_cpu       = 240000000L
board_build.f_flash     = 80000000L
board_build.flash_mode  = qio
board_build.flash_size  = 16MB
board_upload.maximum_size = 16777216

; 16MB Partition: ~3MB App, ~10MB Filesystem
board_build.partitions  = partitions/esp32_partition_app2944k_spiffs10M.csv

custom_safeboot         = tasmota32-safeboot

build_flags             = ${env:tasmota32_base.build_flags}
                          -DMY_LANGUAGE=de_DE
                          -DFIRMWARE_TASMOTA32_16MB_SML

; Optional: Serial Port anpassen
; upload_port             = /dev/ttyUSB0
; monitor_port            = /dev/ttyUSB0